# Fly.io config for poly-agent trading bot
# Region: Dublin (eu-west-1) — Polymarket's closest non-georestricted region
# See: https://docs.polymarket.com/api-reference/geoblock

app = "poly-agent-trading"
primary_region = "dub"

[build]
  dockerfile = "Dockerfile"

# Override CMD to run the trading bot (not the pipeline service)
[processes]
  app = "node dist/index.js"

[env]
  NODE_ENV = "production"

[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout  = "5s"
    grace_period = "30s"
    method   = "GET"
    path     = "/health"
