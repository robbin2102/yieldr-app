# Fly.io config for poly-agent trading bot
# Region: Stockholm, Sweden (arn) — closest non-geoblocked region to Polymarket eu-west-2
# See: https://docs.polymarket.com/api-reference/geoblock

app = "poly-agent-trading"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"

[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout  = "5s"
    grace_period = "30s"
    method   = "GET"
    path     = "/health"
