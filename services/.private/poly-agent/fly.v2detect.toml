# Fly.io config — v2 OnChain detector (detection-only, no execution)
# Region: Stockholm (arn) — closest non-geoblocked region to Polymarket CLOB
# Deploy: fly deploy --config fly.v2detect.toml

app            = "poly-agent-trading"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.v2detect"

# tsx runs directly — no separate [processes] override needed

[env]
  NODE_ENV       = "production"
  DETECTION_ONLY = "true"

# shared-cpu-1x (256 MB) is sufficient for a WS listener + MongoDB client
[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
