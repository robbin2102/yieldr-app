[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPaths = ["services/mcp-server/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
startCommand = "node --dns-result-order=ipv4first dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
numReplicas = 1
